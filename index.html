<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>DK Upload - Ecossistema de Sucesso</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #0f3460;
            --accent: #e94560;
            --success: #00b894;
            --text: #ffffff;
            --text-secondary: #b2b2b2;
            --nav-height: 70px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 20px);
            overflow-x: hidden;
        }
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 45px; height: 45px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 10px rgba(233, 69, 96, 0.3); }
        .user-info h3 { font-size: 0.9rem; margin-bottom: 2px; }
        .level-badge { font-size: 0.7rem; background: var(--success); padding: 2px 8px; border-radius: 10px; color: #000; font-weight: 700; }
       
        .xp-container { width: 100px; text-align: right; }
        .xp-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .xp-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s ease; }
        .xp-text { font-size: 0.7rem; color: var(--text-secondary); }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; position: relative; }
        .section { display: none; }
        .section.active { display: block; animation: slideIn 0.3s ease-out; }
        .card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        h2 { font-size: 1.4rem; margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: white; font-family: inherit; outline: none; }
        input:focus, select:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); }
        button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
        button:active { transform: scale(0.98); }
        button.secondary { background: transparent; border: 1px solid var(--glass-border); }
        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--glass-border);
            z-index: 1000;
        }
        .nav-item { color: var(--text-secondary); text-align: center; font-size: 0.8rem; padding: 10px; transition: 0.3s; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }
        .balance-hero { text-align: center; padding: 30px 0; }
        .balance-amount { font-size: 2.5rem; font-weight: 700; color: var(--success); text-shadow: 0 0 20px rgba(0, 184, 148, 0.3); }
        .trans-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; }
        .money-plus { color: var(--success); font-weight: bold; }
        .money-minus { color: #ff6b6b; font-weight: bold; }
        .levelup-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #e94560, #c0392b); padding: 30px; border-radius: 20px;
            text-align: center; z-index: 2000; display: none; box-shadow: 0 0 50px rgba(233, 69, 96, 0.5);
            width: 80%; max-width: 300px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .levelup-popup.show { transform: translate(-50%, -50%) scale(1); display: block; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .lang-select { width: auto; padding: 5px 10px; background: rgba(0,0,0,0.3); font-size: 0.8rem; border-radius: 20px; margin-bottom: 10px; display: block; margin-left: auto; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="levelup-modal" class="levelup-popup">
        <h1><i class="fas fa-crown"></i> LEVEL UP!</h1>
        <p data-i18n="newLevel">Você alcançou o nível:</p>
        <h2 id="new-level-name" style="font-size: 1.8rem; margin: 10px 0;">Mestre</h2>
        <button onclick="closeLevelModal()" style="background: white; color: var(--accent);" data-i18n="awesome">Incrível!</button>
    </div>

    <header>
        <div class="user-profile">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <h3 id="user-name">Visitante</h3>
                <span class="level-badge" id="user-rank">Iniciante</span>
            </div>
        </div>
        <div class="xp-container">
            <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
            <span class="xp-text">XP: <span id="xp-val">0</span>/100</span>
        </div>
    </header>

    <div class="container">
        <select id="lang-selector" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="pt">🇧🇷 PT</option>
            <option value="en">🇺🇸 EN</option>
            <option value="es">🇪🇸 ES</option>
        </select>

        <div id="dash" class="section active">     <!-- seções aqui (igual ao seu código original) --></div>
        <div id="wallet" class="section">         <!-- ... --></div>
        <div id="sage" class="section">           <!-- ... --></div>
        <div id="mindset" class="section">        <!-- ... --></div>
        <div id="analytics" class="section">      <!-- ... --></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" data-target="dash" onclick="navTo('dash')">
            <i class="fas fa-home"></i> <span data-i18n="navHome">Início</span>
        </div>
        <div class="nav-item" data-target="wallet" onclick="navTo('wallet')">
            <i class="fas fa-wallet"></i> <span data-i18n="navWallet">Carteira</span>
        </div>
        <div class="nav-item" data-target="sage" onclick="navTo('sage')">
            <i class="fas fa-book-open"></i> <span data-i18n="navLearn">Aprender</span>
        </div>
        <div class="nav-item" data-target="mindset" onclick="navTo('mindset')">
            <i class="fas fa-brain"></i> <span data-i18n="navMind">Mindset</span>
        </div>
    </nav>

<script>
// ======================== TRADUÇÃO ========================
const i18n = { /* objeto i18n exatamente como você tinha */ 
    pt: { navHome: "Início", navWallet: "Carteira", navLearn: "Aprender", navMind: "Mindset", currentBalance: "Saldo Total", addBtn: "Adicionar", detailsBtn: "Detalhes", dailyWisdom: "Sabedoria do Dia", recentActivity: "Atividade Recente", newTransaction: "Nova Transação", expense: "Despesa 📉", income: "Receita 📈", catFood: "Alimentação", catTransport: "Transporte", catHousing: "Moradia", catSalary: "Salário/Vendas", catInvest: "Investimento", catOther: "Outros", save: "Salvar", history: "Histórico Completo", sageLessons: "Lições dos Sábios", sageIntro: "Estude para desbloquear sua mente milionária.", bizProfile: "Perfil de Negócios", quizIntro: "Descubra seu arquétipo empresarial para tomar decisões melhores.", startQuiz: "Iniciar Questionário", redoQuiz: "Refazer", financialXray: "Raio-X Financeiro", newLevel: "Você alcançou o nível:", awesome: "Incrível!", ranks: ["Iniciante", "Aprendiz", "Poupador", "Investidor", "Mestre", "Magnata", "Lenda"] },
    en: { /* ... mesmo conteúdo em inglês ... */ },
    es: { /* ... mesmo conteúdo em espanhol ... */ }
};

let userLang = navigator.language || navigator.userLanguage;
let lang = localStorage.getItem('dk_lang') || (userLang.startsWith('pt') ? 'pt' : userLang.startsWith('es') ? 'es' : 'en');
document.getElementById('lang-selector').value = lang;

function t(key) { return i18n[lang][key] || key; }

function updateUI() {
    document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n));
    document.querySelectorAll('option[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n));
    updateUserRankUI();
    if (document.getElementById('analytics').classList.contains('active')) renderChart();
    loadTransactions();
}

function changeLanguage(v) {
    lang = v;
    localStorage.setItem('dk_lang', v);
    updateUI();
    loadLessons();
}

// ======================== BANCO DE DADOS ========================
const db = new Dexie("DKFinanceDB");
db.version(1).stores({
    transactions: '++id, type, amount, category, desc, date',
    user: 'id, xp, level, name',
    lessons: 'id, completed'
});

// ======================== VARIÁVEIS GLOBAIS ========================
let currentUser = { xp: 0, level: 0, name: "Futuro Milionário" };
let myChart = null;

// ======================== INICIALIZAÇÃO ========================
async function init() {
    let user = await db.user.get(1);
    if (!user) {
        await db.user.add({ id: 1, xp: 0, level: 0, name: "Futuro Milionário" });
        user = await db.user.get(1);
    }
    currentUser = user;

    updateUI();
    loadTransactions();
    loadLessons();
    updateXP(0);

    const quotes = [
        "O dinheiro é um excelente servo, mas um péssimo mestre.",
        "A riqueza começa na mente.",
        "Não trabalhe pelo dinheiro, faça o dinheiro trabalhar por você.",
        "Pague a si mesmo primeiro.",
        "Investir em conhecimento rende sempre os melhores juros."
    ];
    document.getElementById('daily-quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];

    navTo('dash'); // <--- importante para ativar a primeira tela
}
window.addEventListener('DOMContentLoaded', init);

// ======================== NAVEGAÇÃO ========================
function navTo(sectionId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId)?.classList.add('active');

    document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.remove('active');
        if (n.dataset.target === sectionId) n.classList.add('active');
    });

    if (sectionId === 'analytics') renderChart();
    window.scrollTo(0, 0);
}

// ======================== GAMIFICAÇÃO ========================
function updateXP(amount) {
    currentUser.xp += amount;
    const newLevel = Math.floor(currentUser.xp / 100);
    if (newLevel > currentUser.level) {
        currentUser.level = newLevel;
        showLevelUpModal();
    }
    db.user.put(currentUser);

    const currentLevelXP = currentUser.xp % 100;
    document.getElementById('xp-val').innerText = currentLevelXP;
    document.getElementById('xp-fill').style.width = currentLevelXP + '%';
    updateUserRankUI();
}

function updateUserRankUI() {
    const ranks = i18n[lang].ranks;
    const rankIndex = Math.min(currentUser.level, ranks.length - 1);
    document.getElementById('user-rank').innerText = ranks[rankIndex] + " (Lvl " + currentUser.level + ")";
}

function showLevelUpModal() {
    const ranks = i18n[lang].ranks;
    const rankIndex = Math.min(currentUser.level, ranks.length - 1);
    document.getElementById('new-level-name').innerText = ranks[rankIndex];
    document.getElementById('levelup-modal').classList.add('show');
}
function closeLevelModal() {
    document.getElementById('levelup-modal').classList.remove('show');
}

// ======================== TRANSAÇÕES ========================
document.getElementById('trans-form').addEventListener('submit', async e => {
    e.preventDefault();
    const type = document.getElementById('t-type').value;
    const amount = parseFloat(document.getElementById('t-amount').value);
    const desc = document.getElementById('t-desc').value.trim();
    const category = document.getElementById('t-cat').value;

    if (!amount || !desc) return;

    await db.transactions.add({ type, amount, desc, category, date: new Date() });
    updateXP(10);
    loadTransactions();
    e.target.reset();
    alert(t('save') + " ✅");
});

async function loadTransactions() {
    const trans = await db.transactions.orderBy('date').reverse().toArray();
    let total = 0;

    const formatTrans = tItem => {
        const cat = t('cat' + tItem.category);
        const dateStr = new Date(tItem.date).toLocaleDateString();
        const sign = tItem.type === 'income' ? '+' : '-';
        const color = tItem.type === 'income' ? 'money-plus' : 'money-minus';
        total += tItem.type === 'income' ? tItem.amount : -tItem.amount;
        return `<div class="trans-item">
            <div class="trans-info"><h4>${tItem.desc}</h4><span>${dateStr} - ${cat}</span></div>
            <div class="${color}">${sign} R$${tItem.amount.toFixed(2)}</div>
        </div>`;
    };

    const recent = trans.slice(0, 5).map(formatTrans).join('');
    const full = trans.map(formatTrans).join('');

    const currency = lang === 'en' ? 'USD' : lang === 'es' ? 'EUR' : 'BRL';
    document.getElementById('total-balance').innerText = total.toLocaleString(lang, { style: 'currency', currency });
    document.getElementById('recent-transactions').innerHTML = recent || '<p style="text-align:center;opacity:0.5;">Sem dados.</p>';
    document.getElementById('full-history').innerHTML = full || '<p style="text-align:center;opacity:0.5;">Sem dados.</p>';
}

// ======================== GRÁFICO ========================
async function renderChart() {
    const trans = await db.transactions.toArray();
    const cats = {};

    trans.filter(t => t.type === 'expense').forEach(t => {
        cats[t.category] = (cats[t.category] || 0) + t.amount;
    });

    if (Object.keys(cats).length === 0) {
        if (myChart) myChart.destroy();
        return;
    }

    const ctx = document.getElementById('expenseChart').getContext('2d');
    if (myChart) myChart.destroy();

    myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(cats).map(k => t('cat' + k)),
            datasets: [{ data: Object.values(cats), backgroundColor: ['#e94560', '#0f3460', '#00b894', '#f39c12', '#8e44ad', '#3498db'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
    });
}

// ======================== LIÇÕES ========================
const lessonsData = [
    {id: 1, title: "A Lei do Pagamento", text: "Separe 10% de tudo que ganha antes de gastar qualquer centavo."},
    {id: 2, title: "Controle do Orçamento", text: "Diferencie desejos de necessidades. Viva com 90% do que ganha."},
    {id: 3, title: "Aumente sua Habilidade", text: "A melhor forma de ganhar mais é aprender mais. Seu conhecimento é seu maior ativo."}
];

async function loadLessons() {
    const completed = await db.lessons.toArray();
    const completedIds = completed.map(c => c.id);

    const html = lessonsData.map(l => {
        const done = completedIds.includes(l.id);
        return `<div class="card" style="border-left: 3px solid ${done ? 'var(--success)' : 'var(--accent)'}">
            <h3>${l.title}</h3>
            <p style="font-size:0.9rem; margin-bottom:10px; color:#ddd;">${l.text}</p>
            <button class="secondary" onclick="toggleLesson(${l.id})" ${done ? 'disabled' : ''}>
                ${done ? 'Concluído ✅' : 'Marcar como Lido (+50 XP)'}
            </button>
        </div>`;
    }).join('');
    document.getElementById('lessons-container').innerHTML = html;
}

async function toggleLesson(id) {
    await db.lessons.add({id, completed: 1});
    updateXP(50);
    loadLessons();
}

// ======================== QUIZ (mantido exatamente como você fez) ========================
// ... (código do quiz idêntico ao seu, apenas com crases corretas onde necessário)

</script>
</body>
</html>
